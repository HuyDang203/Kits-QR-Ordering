<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="robots" content="noindex" />
  <title>Offline · Kits Coffee Atelier</title>
  <link rel="stylesheet" href="/css/interaction-feedback.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #0b0b0b;
      color: #f5f3ef;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }
    body {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    main {
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .k {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #a06a45;
    }
    h1 {
      font-weight: 600;
      font-size: 1.5rem;
      margin: 0;
      letter-spacing: -0.01em;
    }
    p {
      max-width: 22rem;
      line-height: 1.6;
      color: #a8a29e;
      font-size: 0.95rem;
      margin: 0;
    }
    button {
      min-height: 2.75rem;
      padding: 0 1.5rem;
      border-radius: 8px;
      border: 1px solid rgba(160, 106, 69, 0.55);
      background: #a06a45;
      color: #f5f3ef;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:active {
      background: #8b5e3c;
    }
    .lang {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      margin-top: 0.4rem;
    }
    .lang button {
      min-height: 2rem;
      padding: 0 0.75rem;
      background: transparent;
      color: #a8a29e;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <p class="k" id="offline-brand">Kits Coffee Atelier</p>
    <h1 id="offline-title">…</h1>
    <p id="offline-lede">…</p>
    <button type="button" id="offline-retry" onclick="location.reload()">…</button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang-set="en">EN</button>
      <button type="button" data-lang-set="vi">VI</button>
    </div>
  </main>
  <script src="/js/interaction-feedback.js"></script>
  <script src="/js/guest-i18n.js"></script>
  <script>
    function paintOffline() {
      if (!window.LuxuryI18n) return;
      document.getElementById("offline-brand").textContent = LuxuryI18n.t("home.brand");
      document.getElementById("offline-title").textContent = LuxuryI18n.t("errors.offlineTitle");
      document.getElementById("offline-lede").textContent = LuxuryI18n.t("errors.offlineLede");
      document.getElementById("offline-retry").textContent = LuxuryI18n.t("errors.retry");
      document.documentElement.lang = LuxuryI18n.getLang() === "vi" ? "vi" : "en";
      if (window.InteractionFeedback) InteractionFeedback.syncPrefUi();
    }
    (window.LuxuryI18n && LuxuryI18n.ready ? LuxuryI18n.ready : Promise.resolve()).then(paintOffline);
    window.addEventListener("luxury:i18n-changed", paintOffline);
    document.querySelectorAll("[data-lang-set]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (window.LuxuryI18n) LuxuryI18n.setLang(btn.getAttribute("data-lang-set"));
      });
    });
  </script>
</body>
</html>

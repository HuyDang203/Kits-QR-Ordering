<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="robots" content="noindex" />
  <title>Bảo trì · Kits Coffee Atelier</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: #0b0b0b;
      color: #f5f3ef;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }
    body {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    main {
      max-width: 24rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .k {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #a06a45;
    }
    h1 {
      font-weight: 600;
      font-size: 1.5rem;
      margin: 0;
      letter-spacing: -0.01em;
    }
    p {
      max-width: 22rem;
      line-height: 1.6;
      color: #a8a29e;
      font-size: 0.95rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <p class="k">Kits Coffee Atelier</p>
    <h1>Tạm bảo trì</h1>
    <p>Hệ thống đang được bảo trì. Vui lòng quay lại sau ít phút hoặc gọi nhân viên phục vụ.</p>
  </main>
</body>
</html>
